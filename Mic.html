<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مايك الجوال</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 30px; background: #111; color: #fff; }
  #micBtn { width: 180px; height: 180px; border-radius: 50%; border: none; font-size: 22px; font-weight: bold; background: #e11d48; color: white; }
  #micBtn.on { background: #22c55e; }
  input { width: 90%; margin-top: 25px; }
</style>
</head>
<body>

<h2>🎤 تكلم ويطلع من سماعة الجوال</h2>
<button id="micBtn">اضغط لتشغيل المايك</button>
<br><br>
<label>قوة الصوت</label>
<input type="range" id="volume" min="0" max="2" step="0.1" value="1">
<p id="status">غير شغال - افصل البلوتوث</p>

<!-- هذي هي اللي تجبر الصوت يطلع من السماعة -->
<audio id="out" autoplay playsinline></audio>

<script>
let ctx, source, gain, stream, audioEl;
let running = false;
const btn = document.getElementById('micBtn');
const status = document.getElementById('status');
const volume = document.getElementById('volume');
audioEl = document.getElementById('out');

btn.onclick = async () => {
  if (!running) {
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      await ctx.resume();

      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });

      // الطريقة الثانية: نشغل الصوت عن طريق عنصر audio عشان الجوال يفهم انه سماعة خارجية
      audioEl.srcObject = stream;
      audioEl.volume = 1;
      audioEl.play();

      source = ctx.createMediaStreamSource(stream);
      gain = ctx.createGain();
      gain.gain.value = parseFloat(volume.value);
      source.connect(gain);
      gain.connect(ctx.destination);

      running = true;
      btn.textContent = 'شغال .. اضغط للإيقاف';
      btn.classList.add('on');
      status.textContent = 'تكلم الحين - لازم تسمع نفسك من سماعة الجوال';
    } catch(e) {
      alert('لازم تسمح للمايك');
    }
  } else {
    stream.getTracks().forEach(t => t.stop());
    audioEl.srcObject = null;
    ctx.close();
    running = false;
    btn.textContent = 'اضغط لتشغيل المايك';
    btn.classList.remove('on');
    status.textContent = 'غير شغال';
  }
};

volume.oninput = () => {
  if (gain) gain.gain.value = parseFloat(volume.value);
  if (audioEl) audioEl.volume = 1;
};
</script>

</body>
</html>
